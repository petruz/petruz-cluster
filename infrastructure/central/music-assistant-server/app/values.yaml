
service:
  main:
    ports:
      http:
        port: 8095

ingress:
  main:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: "nginx"
      nginx.ingress.kubernetes.io/auth-url: "https://oauth2-proxy.petruz-central.it/oauth2/auth"
      nginx.ingress.kubernetes.io/auth-signin: "https://oauth2-proxy.petruz-central.it/oauth2/start"
      nginx.ingress.kubernetes.io/auth-response-headers: "x-auth-request-user, x-auth-request-email"
      ingress.kubernetes.io/force-ssl-redirect: "true"
      ingress.kubernetes.io/proxy-body-size: "1024m"
      nginx.ingress.kubernetes.io/proxy-body-size: "1024m"
    hosts:
      - host: &host "music.petruz-central.it"
        paths:
          - path: /
    tls:
      - hosts:
          - *host

persistence:
  config:
    enabled: true
    mountPath: /data
    existingClaim: music-assistant-server-data
  additionalVolume:
    enabled: true
    mountPath: /media
    existingClaim: synology-nfs-pvc